name: Funding Radar - hourly collection and Pages

on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "17 0-12,14-23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "web/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: read

concurrency:
  group: funding-radar-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      collection_status: ${{ steps.collection.outcome }}
      site_ready: ${{ steps.site.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test collector, public boundary and UI logic
        run: |
          python -m unittest discover -s tests -v
          node --test tests/web.test.mjs
      - name: Collect public funding headlines
        id: collection
        continue-on-error: true
        run: python scripts/collect.py
      - name: Save archive and source health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funding.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public funding signals" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
          fi
      - name: Build only allowlisted public files
        run: python scripts/build.py
      - name: Upload public site
        id: site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Enrich reviewed domains (private repositories only)
        id: contacts
        if: github.event.repository.private == true && steps.collection.outcome == 'success' && (github.event_name != 'schedule' || github.event.schedule == '17 13 * * *')
        continue-on-error: true
        env:
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: python scripts/enrich.py
      - name: Store private contacts, never Pages
        if: github.event.repository.private == true && steps.contacts.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: private-founder-contacts
          path: private/
          retention-days: 7
          if-no-files-found: error
      - name: Report contact provider failure
        if: steps.contacts.outcome == 'failure'
        run: |
          echo "::error::Private contact enrichment failed. Inspect the coverage artifact; the public funding site is independent."
          exit 1

  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled' && needs.collect.outputs.site_ready == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy funding-only site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public website and funding data
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urljoin
          from urllib.request import urlopen

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          for attempt in range(12):
              try:
                  with urlopen(base, timeout=20) as response:
                      html = response.read().decode()
                  if "<title>Funding Radar" not in html:
                      raise ValueError("The live URL does not serve the Funding Radar homepage")
                  for asset in ("app.js", "styles.css"):
                      with urlopen(urljoin(base, asset), timeout=20) as response:
                          if not response.read():
                              raise ValueError(f"Empty public asset: {asset}")
                  with urlopen(urljoin(base, "data.json"), timeout=20) as response:
                      data = json.load(response)
                  if data.get("schema_version") != 1 or not isinstance(data.get("records"), list):
                      raise ValueError("The live site has an invalid funding dataset")
                  if not data.get("last_attempt_at"):
                      raise ValueError("The live site still has the uninitialized dataset")
                  if "contacts" in data or any("email" in row or "contacts" in row for row in data["records"]):
                      raise ValueError("Private contact fields must not appear in public data")
                  healthy = sum(source["status"] == "ok" for source in data["sources"])
                  print(f"Live URL verified: {base}")
                  print(f"Funding signals: {len(data['records'])}; healthy sources: {healthy}/{len(data['sources'])}; coverage: {data['status']}")
                  break
              except (HTTPError, URLError, TimeoutError, ValueError) as error:
                  if attempt == 11:
                      raise
                  print(f"Waiting for Pages/CDN propagation: {type(error).__name__}")
                  time.sleep(5)
          PY
      - name: Fail visibly if every feed failed
        if: needs.collect.outputs.collection_status == 'failure'
        run: |
          echo "::error::All feeds failed (or collector crashed). Preserved archive and source health were published; no fresh coverage is claimed."
          exit 1
