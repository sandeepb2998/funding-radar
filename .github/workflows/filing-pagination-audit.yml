name: Verify public filing pagination coverage
on:
  push:
    paths: [".github/workflows/filing-pagination-audit.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from urllib.parse import urlencode
          sys.path.insert(0, "scripts")
          from formds import fetch_page, Page, parse_listing
          for url in ("https://www.formds.com/filings/advanced_filter", "https://www.formds.com/filings/newest?page=5"):
              root = Page(fetch_page(url)).root
              if "advanced_filter" in url:
                  for form in root.elements("form"):
                      if form.attrs.get("id") != "advanced_filter_form":
                          continue
                      values = {}
                      for select in form.elements("select"):
                          options = list(select.elements("option"))
                          desired = "Last Week" if "date_select" in select.attrs["name"] else "New Filings" if "new_amended_select" in select.attrs["name"] else options[0].text()
                          option = next(o for o in options if o.text() == desired)
                          values[select.attrs["name"]] = option.attrs.get("value", option.text())
                      values["filters_params[list_or_map_select]"] = "Show as a list"
                      filtered_url = "https://www.formds.com/filings/advanced_filter?" + urlencode(values)
                      body = fetch_page(filtered_url)
                      Path("evidence").mkdir(exist_ok=True)
                      Path("evidence/filtered.html").write_bytes(body)
                      filtered = Page(body).root
                      print(json.dumps({"filtered_url": filtered_url, "tables": [table.attrs for table in filtered.elements("table")], "pagination": [a.attrs for a in filtered.elements("a") if "page=" in a.attrs.get("href", "")]}))
              else:
                  rows, oldest, more, invalid = parse_listing(fetch_page(url))
                  print(json.dumps({"url": url, "qualifying_rows": len(rows), "oldest": oldest, "has_more": more,
                                    "pagination": [a.attrs for a in root.elements("a") if "page=" in a.attrs.get("href", "")]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-filtered-filing-evidence
          path: evidence/
          retention-days: 1
