name: Funding source access audit

on:
  push:
    paths: [".github/workflows/source-audit.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public provider documentation and feed availability
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from concurrent.futures import ThreadPoolExecutor
          from html.parser import HTMLParser
          from urllib.error import URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hidden = 0
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag in ("script", "style"):
                      self.hidden += 1
              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.hidden = max(0, self.hidden - 1)
              def handle_data(self, data):
                  if not self.hidden:
                      self.parts.append(data)

          urls = [
              "https://www.tryfundable.ai/home",
              "https://www.tryfundable.ai/data",
              "https://docs.tryfundable.ai/llms.txt",
              "https://docs.tryfundable.ai/openapi.json",
              "https://docs.tryfundable.ai/api-reference/alerts/list.md",
              "https://docs.tryfundable.ai/api-reference/deals/list.md",
              "https://techfundingnews.com/feed/",
              "https://siliconcanals.com/feed/",
              "https://venturebeat.com/category/ai/feed/",
              "https://news.google.com/rss/search?q=" + quote('("raises" OR "secures") (funding OR "Series A" OR "seed round") when:7d') + "&hl=en-US&gl=US&ceid=US:en",
          ]

          def inspect(url):
              try:
                  request = Request(url, headers={"User-Agent": "FundingRadar/1.1 public-source research"})
                  with urlopen(request, timeout=25) as response:
                      body = response.read(4 * 1024 * 1024).decode("utf-8", errors="replace")
                  result = {"url": url, "bytes": len(body)}
                  if body.lstrip().startswith("{"):
                      spec = json.loads(body)
                      result["servers"] = spec.get("servers")
                      result["paths"] = {p: list(methods) for p, methods in spec.get("paths", {}).items() if any(word in p for word in ("alerts", "deals", "companies"))}
                      result["authentication"] = spec.get("components", {}).get("securitySchemes")
                      result["schemas"] = list(spec.get("components", {}).get("schemas", {}))
                  elif "<rss" in body or "<feed" in body:
                      root = ET.fromstring(body)
                      entries = [n for n in root.iter() if n.tag.split("}")[-1] in ("item", "entry")]
                      result["entries"] = len(entries)
                      result["headlines"] = [next(("".join(n.itertext()) for n in e if n.tag.split("}")[-1] == "title"), "") for e in entries[:8]]
                      result["publishers"] = list(dict.fromkeys(n.text for e in entries for n in e if n.tag.split("}")[-1] == "source"))[:12]
                  else:
                      parser = Text()
                      parser.feed(body)
                      text = " ".join(" ".join(parser.parts).split()) if "<html" in body.lower() else body
                      result["source_claims"] = re.findall(r".{0,45}(?:10[,\.]000|news sources|times daily|multiple times|refreshed|refreshes|daily).{0,65}", text, flags=re.I)[:4]
                      result["api_urls"] = sorted(set(re.findall(r"https://[^\s<>\"')]+", text)))[:35]
                      if url.endswith(".md"):
                          result["api_fields"] = [line for line in text.splitlines() if re.search(r"GET |POST |base_url|baseURL|Authorization|date_start|date_end|page_size|cursor|limit|source|amount|announced|company|openapi", line, re.I)][:45]
                  return result
              except (URLError, TimeoutError, ValueError, ET.ParseError) as error:
                  return {"url": url, "error": str(error)}

          with ThreadPoolExecutor(max_workers=5) as pool:
              for result in pool.map(inspect, urls):
                  print(json.dumps(result, ensure_ascii=True))
          PY
